# 新建 release 时构建 Quick App 便携版, 并把压缩包上传到该 release 的 assets
# 发布包由 src/quick_app/scripts/copy_release.py 复制而成, 该脚本的构建输出目录名与复制清单
# 必须与构建流程保持一致, 变更构建目录名或新增依赖时同步维护该脚本
name: 发布QuickApp便携版

on:
  release:
    types: ["published"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要上传的 release tag,如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

# 同一个 tag 的发布只允许一个构建在跑: 重复触发时取消先到的, 避免两个构建互相覆盖 release 资产
concurrency:
  group: release-quick-app-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # release 事件取 release 的 tag, 手动触发取输入; 版本号去掉前缀 v
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      VER: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          # 手动触发时按输入的 tag 检出, 不取默认分支的源码, 否则可能用开发分支构建出同名 tag 的包
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          arch: "win64_mingw"
          tools: "tools_mingw1310"
          cache: true

      - name: 校验版本号
        shell: pwsh
        run: |
          $ver = $env:VER -replace '^v', ''
          $line = Select-String -Path "src/quick_app/CMakeLists.txt" -Pattern '^project\(CryingMusic VERSION' | Select-Object -First 1
          if (-not $line) {
            Write-Error "未能从 src/quick_app/CMakeLists.txt 读到 project VERSION"
            exit 1
          }
          $cmakeVer = ($line.Line -split '\s+')[2]
          Write-Host "CMakeLists.txt 版本号: $cmakeVer"
          Write-Host "release 版本号:      $ver"
          if ($cmakeVer -ne $ver) {
            Write-Error "版本号不一致: CMakeLists.txt 为 $cmakeVer, release tag 为 $ver"
            exit 1
          }
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 配置CMake
        shell: cmd
        # QT_ROOT_DIR 是 Qt 套件的安装根(如 C:\Qt\6.11.1\mingw_64), Qt6_DIR 指向其中的 lib/cmake/Qt6, 不能当前缀
        run: cmake -S src/quick_app -B src/quick_app/build/Desktop_Qt_6_11_1_MinGW_64_bit_Release -G "MinGW Makefiles" -DCMAKE_PREFIX_PATH=%QT_ROOT_DIR% -DCMAKE_BUILD_TYPE=Release

      - name: 构建Release
        shell: cmd
        run: cmake --build src/quick_app/build/Desktop_Qt_6_11_1_MinGW_64_bit_Release

      - name: 复制纯净发布包
        shell: cmd
        run: python src/quick_app/scripts/copy_release.py

      - name: 补齐MinGW运行时
        shell: pwsh
        run: |
          $pkg = "src/quick_app/release/Crying-Music"
          $build = "src/quick_app/build/Desktop_Qt_6_11_1_MinGW_64_bit_Release"
          foreach ($dll in @("libgcc_s_seh-1.dll", "libstdc++-6.dll", "libwinpthread-1.dll")) {
            if (-not (Test-Path (Join-Path $pkg $dll))) {
              Copy-Item (Join-Path $build $dll) $pkg -Force
              Write-Host "已补入 $dll"
            }
          }

      - name: 校验发布包
        shell: pwsh
        run: |
          $pkg = "src/quick_app/release/Crying-Music"
          # 主程序, Qt 运行库与随包分发的许可文本缺任一项即失败
          $required = @(
            "CryingMusic.exe",
            "Qt6Core.dll",
            "Qt6Quick.dll",
            "Qt6Multimedia.dll",
            "LICENSE",
            "COPYRIGHT",
            "LICENSE.FDL",
            "LICENSE.Qt",
            "THIRD-PARTY-NOTICES.md"
          )
          $missing = @()
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path $pkg $name))) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error ("发布包缺少: " + ($missing -join ", "))
            exit 1
          }

      - name: 归位并压缩
        shell: pwsh
        run: |
          $pkg = "src/quick_app/release/Crying-Music"
          $stage = "pkg/CryingMusic"
          # 压缩包名只在此处生成, 上传步骤复用 ZIP_NAME, 版本号已带 v 前缀时不重复添加
          $ver = $env:VER -replace '^v', ''
          $ZIP_NAME = "Crying-Music-Quick-App-v$ver-Windows_x64-Portable.zip"
          # GITHUB_ENV 只认 NAME=value 的行格式, 直接写值不会导出到后续步骤
          "ZIP_NAME=$ZIP_NAME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Path "pkg" -Force | Out-Null
          Move-Item $pkg $stage
          Compress-Archive -Path $stage -DestinationPath $ZIP_NAME -CompressionLevel Optimal
          Write-Host "已生成 $ZIP_NAME"

      - name: 上传到release
        shell: cmd
        run: gh release upload %TAG% %ZIP_NAME% --clobber
        env:
          GH_TOKEN: ${{ github.token }}
