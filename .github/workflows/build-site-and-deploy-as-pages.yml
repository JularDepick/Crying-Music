# 构建并部署静态内容到 GitHub Pages(可复用工作流)
# 本文件只放执行内容, 不放触发条件: 触发交给 main 上的 while-push-main-site.yml
# 与 online-data 分支上的 while-push-online-data.yml, 两者都用 @main 调用本文件
# 发布内容 = main 分支的 site/ 目录 + online-data 分支的全量内容(在线曲库数据: oss/ 与 audio/)
# 约定: 同名路径以 online-data 为准; .git 与 .github 不进发布目录, .gitignore 不作为内容发布
# 约定: 本文件不写 concurrency, 互斥与撤回由调用方用同一个并发组实现, 同名组会导致自我取消
# 约定: 被复用工作流拿到的 github 上下文属于调用方, 因此下面的 checkout 必须显式写 ref
# 注意: 若仓库的 github-pages 环境配了部署分支限制, 需要放行 online-data 分支(部署 ref 取调用方的 ref)
name: 构建并部署站点与在线曲库数据到Pages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取main分支
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo-main
          fetch-depth: 1

      - name: 拉取online-data分支
        uses: actions/checkout@v4
        with:
          ref: online-data
          path: repo-online
          fetch-depth: 1

      - name: 组装发布目录
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          # 站点本体: main分支的site/目录, 目录尚无内容时跳过
          if [ -d repo-main/site ]; then
            cp -a repo-main/site/. _site/
          fi
          # 在线曲库数据: online-data分支的全量内容, 同名路径以它为准;
          # .git与.github不进发布目录, .gitignore不是内容也不发布
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.gitignore' repo-online/ _site/
          echo "发布目录: 文件 $(find _site -type f | wc -l) 个, 体积 $(du -sh _site | cut -f1)"
          find _site -maxdepth 2 -mindepth 1 -type d | sort

      - name: 配置Pages环境
        uses: actions/configure-pages@v5

      - name: 上传内容
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site/'

  deploy:
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到Pages
        id: deployment
        uses: actions/deploy-pages@v5
