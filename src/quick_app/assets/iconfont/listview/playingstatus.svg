<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="300" height="200">
  <g stroke="#2c2c2c" stroke-width="128" stroke-linecap="round">
    <!-- 柱1：φ=0 -->
    <line x1="120" y1="320" x2="120" y2="576">
      <animate attributeName="y1"
        values="320;64;320;576;320"
        keyTimes="0;0.25;0.5;0.75;1"
        calcMode="spline"
        keySplines="0 0 0.58 1;0.42 0 1 1;0 0 0.58 1;0.42 0 1 1"
        dur="1.2s" begin="0s" repeatCount="indefinite"/>
    </line>

    <!-- 柱2：φ=π/3 -->
    <line x1="360" y1="320" x2="360" y2="576">
      <animate attributeName="y1"
        values="320;64;320;576;320"
        keyTimes="0;0.25;0.5;0.75;1"
        calcMode="spline"
        keySplines="0 0 0.58 1;0.42 0 1 1;0 0 0.58 1;0.42 0 1 1"
        dur="1.2s" begin="-0.2s" repeatCount="indefinite"/>
    </line>

    <!-- 柱3：φ=π/6 -->
    <line x1="600" y1="320" x2="600" y2="576">
      <animate attributeName="y1"
        values="320;64;320;576;320"
        keyTimes="0;0.25;0.5;0.75;1"
        calcMode="spline"
        keySplines="0 0 0.58 1;0.42 0 1 1;0 0 0.58 1;0.42 0 1 1"
        dur="1.2s" begin="-0.1s" repeatCount="indefinite"/>
    </line>

    <!-- 柱4：φ=π/2 -->
    <line x1="840" y1="320" x2="840" y2="576">
      <animate attributeName="y1"
        values="320;64;320;576;320"
        keyTimes="0;0.25;0.5;0.75;1"
        calcMode="spline"
        keySplines="0 0 0.58 1;0.42 0 1 1;0 0 0.58 1;0.42 0 1 1"
        dur="1.2s" begin="-0.3s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>